<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixIt Hawassa</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6324eb",
              "primary-dark": "#501bce",
              secondary: "#0ea5e9",
              "background-light": "#f6f6f8",
              "background-dark": "#161121",
              "surface-light": "#ffffff",
              "surface-dark": "#1e1a29",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .portal-shell {
          background:
            radial-gradient(
              circle at 0% 0%,
              rgba(99, 36, 235, 0.08),
              transparent 38%
            ),
            radial-gradient(
              circle at 100% 100%,
              rgba(14, 165, 233, 0.08),
              transparent 42%
            ),
            #f8fafd;
        }
        .portal-topbar {
          @apply bg-white/85 dark:bg-surface-dark/90 backdrop-blur-md border border-white/60 dark:border-gray-800 shadow-sm;
        }
        .portal-panel {
          @apply bg-white dark:bg-surface-dark border border-[#e8edf7] dark:border-gray-800 rounded-2xl shadow-sm;
        }
        .portal-panel-soft {
          @apply bg-white/80 dark:bg-surface-dark/80 border border-[#e8edf7] dark:border-gray-800 rounded-2xl shadow-sm backdrop-blur-sm;
        }
        .portal-chip {
          @apply inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-semibold border;
        }
        .portal-title {
          @apply text-[#120e1b] dark:text-white tracking-tight;
        }
        .hero-overlay {
          background: linear-gradient(
            rgba(19, 91, 236, 0.1),
            rgba(13, 18, 27, 0.6)
          );
        }
        .hero-gradient {
          background: linear-gradient(
            to right,
            rgba(19, 91, 236, 0.1),
            rgba(19, 91, 236, 0.05)
          );
        }
        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }
        input[type="number"] {
          -moz-appearance: textfield;
        }
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark text-[#0d121b] dark:text-white font-sans antialiased"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
